
---
  - name: Deploy website
    hosts: devops
    become: true

    tasks:
      - name: Create custom index page
        copy:
          dest: /usr/share/nginx/html/index.html
          content: |
            <html>
            <head>
              <title>DevOps Lab</title>
            </head>
            <body>
              <h1>Hello from AlmaLinux Devops Lab</h1>
              <p>This website was deployed using Ansible.</p>
            </body>
            </html>
